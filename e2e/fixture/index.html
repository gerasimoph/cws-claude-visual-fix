<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing — fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .logo-icon { width: 24px; height: 24px; background: #6366f1; border-radius: 6px; }
    .grid { display: flex; gap: 16px; align-items: flex-start; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; width: 220px; }
    .card.monthly { height: 300px; }
    .card.pro { height: 240px; }
    button.cta { padding: 8px 12px; }
  </style>
</head>
<body>
  <header><span class="logo-icon" aria-hidden="true"></span><h1>Acme</h1></header>
  <main>
    <section class="grid">
      <div class="card monthly"><h2>Monthly</h2><p>$10/mo</p><button class="cta">Choose</button></div>
      <div class="card pro" data-testid="pro-card"><h2>Pro</h2><p>$20/mo</p><button class="cta" onclick="window.__clicked = true" ontouchstart="window.__touched = true">Choose</button></div>
    </section>
  </main>
</body>
</html>
