<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Feedback</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <strong>Browser Feedback</strong>
    <span class="muted" id="version"></span>
  </header>
  <section id="tab"></section>
  <section class="actions">
    <button class="primary" id="select">Comment on an element</button>
    <button id="panel">Show review panel</button>
  </section>
  <section id="companion"></section>
  <section id="projects"></section>
  <footer class="muted">Browser context stays on your machine and goes directly to your own coding agent.</footer>
  <script src="../lib/onboarding.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
